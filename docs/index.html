<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApeBS-map</title>
<link rel="icon" href="https://ape-alveare.it/wp-content/uploads/985zHhfN.png" sizes="any">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color: #222; }
  #app { display: flex; height: 100%; }
  #panel { width: 340px; flex: none; overflow: auto; padding: 12px 14px; box-sizing: border-box;
           border-right: 1px solid #ddd; background: #fafafa; }
  #map { flex: 1; min-width: 0; min-height: 0; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .muted { color: #777; font-size: 12px; }
  .group { margin: 12px 0 4px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #555;
           display: flex; justify-content: space-between; align-items: baseline; }
  .group small { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .group small a { color: #06c; cursor: pointer; margin-left: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { border: 1px solid #bbb; background: #fff; color: #333; border-radius: 12px; padding: 2px 9px; cursor: pointer; font: inherit; font-size: 12px; }
  .chip.on { background: #223; color: #fff; border-color: #223; }
  input[type=search], input[type=number], select { font: inherit; padding: 4px 6px; border: 1px solid #bbb; border-radius: 4px; box-sizing: border-box; }
  input[type=search] { width: 100%; }
  .range { display: flex; align-items: center; gap: 6px; }
  .range input { width: 80px; }
  label.row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  button.act { font: inherit; padding: 4px 10px; border: 1px solid #bbb; background: #fff; border-radius: 4px; cursor: pointer; }
  #legend { margin-top: 6px; font-size: 12px; }
  .bar { height: 10px; border-radius: 5px; margin: 3px 0; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 4px; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.6); }
  .dot.approx { border: 2px dashed #222; }
  .dot.area { border: 2px dotted #222; opacity: .6; }
  #status { margin: 10px 0 4px; font-weight: 600; }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { padding: 4px 2px; border-bottom: 1px solid #eee; cursor: pointer; }
  #list li:hover { background: #eef; }
  #list li.nopos { color: #888; }
  #list .d { color: #777; font-size: 12px; margin-right: 4px; }
  .pin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.7); }
  .pin.approx { border: 2px dashed #222; }
  .pin.area { border: 2px dotted #222; opacity: .55; }
  .leaflet-popup-content { font-size: 13px; }
  .leaflet-popup-content a { color: #06c; }
  #rcard { border: 1px solid #c9c9e8; background: #f3f3ff; border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
  #rcard .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #rcard a.act { text-decoration: none; color: inherit; display: inline-block; }
  button.act:disabled { opacity: .45; cursor: default; }
  .badge { font-size: 11px; border-radius: 8px; padding: 0 7px; margin-left: 6px; color: #fff; background: #999; white-space: nowrap; }
  .badge.none { background: #666; } .badge.area { background: #d62728; } .badge.approx { background: #ff7f0e; } .badge.exact { background: #1f77b4; } .badge.gpx { background: #2a8a5a; }
  #list li.cur { background: #dde; font-weight: 600; }
  #panel.review #filters { display: none; }
  #map.reviewing, #map.reviewing.leaflet-grab, #map.reviewing.leaflet-drag-target { cursor: crosshair !important; }
  .pin.cur { box-shadow: 0 0 0 4px rgba(0,0,0,.55); }
  .gtabs { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
  .gtab { border: 1px solid #bbb; background: #f2f2f2; color: #333; border-radius: 4px 4px 0 0; padding: 2px 8px;
          font: inherit; font-size: 12px; cursor: pointer; }
  .gtab.on { background: #223; color: #fff; border-color: #223; }
  .gtab.dim { opacity: .5; font-style: italic; }
  .gpanel { border: 1px solid #ddd; border-radius: 0 4px 4px 4px; padding: 6px 8px; margin-top: -1px; }
  .pin.grp { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
             color: #fff; font: bold 11px Arial, sans-serif; text-shadow: 0 0 2px rgba(0,0,0,.6); }
  @media (max-width: 800px) {
    #app { flex-direction: column-reverse; }
    #panel { width: auto; height: 45%; border-right: 0; border-top: 1px solid #ddd; }
    #map { height: 55%; }
  }
</style>
<meta name="robots" content="noindex, nofollow">
<style>#revbar, #rcard { display: none !important; }</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Ape Brescia</h1>
    <div class="muted" id="subtitle"></div>

    <div id="revbar">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px">
        <button class="act" id="rev-toggle">Review mode</button>
        <button class="act" id="rev-dl" disabled>Download fixes.csv</button>
        <button class="act" id="rev-reset">Reset</button>
      </div>
      <div class="muted" id="rev-info"></div>
      <label class="row" id="rev-all-wrap" style="display:none"><input type="checkbox" id="rev-all"> also review exact pins</label>
    </div>
    <div id="rcard" style="display:none"></div>

    <div id="filters">

    <div class="group">Cerca</div>
    <input type="search" id="q" placeholder="luogo, tag...">

    <div class="group">Anno <small><a data-reset="years">rimuovi filtri</a></small></div>
    <div class="chips" id="chips-years"></div>

    <div class="group">Difficoltà (APE) <small><a data-reset="diffs">rimuovi filtri</a></small></div>
    <div class="chips" id="chips-diffs"></div>

    <div class="group">Distanza (km)</div>
    <div class="range"><input type="number" id="km-min" placeholder="min" min="0"> &ndash; <input type="number" id="km-max" placeholder="max" min="0"></div>

    <div class="group">Dislivello (m)</div>
    <div class="range"><input type="number" id="up-min" placeholder="min" min="0"> &ndash; <input type="number" id="up-max" placeholder="max" min="0"></div>

    <div class="group">Display</div>
    <label class="row">Colorato per
      <select id="color">
        <option value="year">Anno</option>
        <option value="difficulty">Difficoltà</option>
      </select>
    </label>
    <label class="row"><input type="checkbox" id="cluster" checked> Raggruppa vicini</label>
    <label class="row"><input type="checkbox" id="group" checked> Un solo pin per evento in più parti</label>
    <label class="row"><input type="checkbox" id="gpx-only"> Solo con traccia GPX</label>
    <div id="legend"></div>
    <div style="margin-top:8px"><button class="act" id="fit">Zoom al risultato</button>
      <button class="act" id="clear-tracks" style="display:none">Nascondi tracce</button></div>
    </div>

    <div id="status"></div>
    <ul id="list"></ul>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script type="module">
const PUBLIC_BUILD = true;

// ---- data: hikes.js (--local build) sets window.HIKES_DATA, otherwise hikes.json is fetched ----------
async function loadEvents() {
  if (window.HIKES_DATA) return window.HIKES_DATA;
  const r = await fetch('hikes.json');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

const yearOf = d => /^\d{4}/.test(d || '') ? +d.slice(0, 4) : null;
const diffLabelOf = d => d == null ? 'n/d' : Number.isInteger(d) ? String(d) : Math.floor(d) + '+';

// One record per event (see compact_events in build_map_ita.py) -> one flat record per hike / leg.
function expandEvents(events) {
  const out = [];
  events.forEach(e => {
    const place = {
      lat: e.lat ?? null, lon: e.lon ?? null, src: e.src || '',
      q: e.lat != null ? ('q' in e ? e.q : 'exact') : null, match: e.match || '', query: e.query || ''
    };
    const hike = (x, extra) => {
      const date = x.date || '', diff = x.diff ?? null;
      return {
        date, dateEnd: x.dateEnd || date, year: 'y' in x ? x.y : yearOf(date),
        km: x.km ?? null, up: x.up ?? null, diff, diffLabel: diffLabelOf(diff), diffRaw: x.diffRaw || '',
        time: x.time || '', loop: !!x.loop, tags: e.tags || '', link: e.link || '', event: e.key,
        tracks: x.tracks || [], ...extra
      };
    };
    if (!e.legs) {
      out.push(hike(e, { name: e.name, ...place, key: e.key, leg: '', eventName: e.name }));
      return;
    }
    e.legs.forEach(l => {
      const own = l.pos ? { lat: l.pos[0], lon: l.pos[1], src: 'manual', q: 'exact', match: '', query: '' } : place;
      out.push(hike(l, {
        name: l.leg ? `${e.name} \u2013 ${l.leg}` : e.name, ...own, key: `${e.key}-${l.n}`, leg: l.leg || '',
        eventName: e.name, ownPos: !!l.own,
        evLat: place.lat, evLon: place.lon, evQ: place.q, evSrc: place.src, evMatch: place.match, evQuery: place.query
      }));
    });
  });
  return out;
}

let HIKES;
try { HIKES = expandEvents(await loadEvents()); }
catch (err) {
  document.getElementById('status').textContent =
    'Impossibile caricare hikes.json: apri la pagina online o con --serve (oppure ricostruisci con --local).';
  throw err;
}
HIKES.forEach((h, i) => { h.i = i; h.tracks = h.tracks || []; });
const EVENT_HIKES = {};       // event -> its legs (a multi-day trip or an outing with variants)
HIKES.forEach(h => (EVENT_HIKES[h.event] = EVENT_HIKES[h.event] || []).push(h));
const FILE_HIKES = {};        // gpx file -> the hikes that use it (a route can be shared by several years)
HIKES.forEach(h => h.tracks.forEach(t => (FILE_HIKES[t.f] = FILE_HIKES[t.f] || []).push(h)));

// A missing element (e.g. one you deleted from the HTML) is ignored instead of crashing the script.
const NOOP = new Proxy(function () {}, { get: () => NOOP, set: () => true, apply: () => NOOP });
const $ = id => document.getElementById(id) || (console.warn('missing element #' + id), NOOP);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '' : (Number.isInteger(n) ? String(n) : n.toFixed(1));
const yk = h => h.year == null ? 'n/d' : String(h.year);

// ---- facets -------------------------------------------------------------
const yearKeys = [...new Set(HIKES.map(yk))].sort((a, b) =>
  a === 'n/d' ? 1 : b === 'n/d' ? -1 : Number(a) - Number(b));
const diffNum = {};
HIKES.forEach(h => { diffNum[h.diffLabel] = h.diff; });
const diffKeys = Object.keys(diffNum).sort((a, b) =>
  (diffNum[a] == null ? 99 : diffNum[a]) - (diffNum[b] == null ? 99 : diffNum[b]));
const numYears = HIKES.map(h => h.year).filter(y => y != null);
const yMin = Math.min(...numYears), yMax = Math.max(...numYears);

const state = {
  years: new Set(), diffs: new Set(),   // empty set = filter inactive
  q: '', km: [null, null], up: [null, null],
  cluster: true, group: true, gpxOnly: false, color: 'year'
};

const review = { on: false, cur: null, all: false, history: [], msg: '' };

function passes(h) {
  if (state.years.size && !state.years.has(yk(h))) return false;
  if (state.diffs.size && !state.diffs.has(h.diffLabel)) return false;
  if (state.gpxOnly && !h.tracks.length) return false;
  if (state.q) {
    const hay = (h.name + ' ' + h.tags + ' ' + h.match).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  const [kmMin, kmMax] = state.km, [upMin, upMax] = state.up;
  if (kmMin != null && (h.km == null || h.km < kmMin)) return false;
  if (kmMax != null && (h.km == null || h.km > kmMax)) return false;
  if (upMin != null && (h.up == null || h.up < upMin)) return false;
  if (upMax != null && (h.up == null || h.up > upMax)) return false;
  return true;
}

// ---- colours ------------------------------------------------------------
function colorOf(h) {
  if (state.color === 'year') {
    if (h.year == null) return '#999';
    const t = yMax > yMin ? (h.year - yMin) / (yMax - yMin) : 0.5;
    return `hsl(${230 - 200 * t},75%,48%)`;
  }
  if (state.color === 'difficulty') {
    if (h.diff == null) return '#999';
    const t = Math.min(1, Math.max(0, (h.diff - 1) / 2.5));
    return `hsl(${130 - 130 * t},70%,42%)`;
  }
  return '#1f77b4';
}

function legendHtml() {
  let html = '';
  if (state.color === 'year') {
    html = `<div class="bar" style="background:linear-gradient(to right,hsl(230,75%,48%),hsl(130,75%,48%),hsl(30,75%,48%))"></div>
            <div style="display:flex;justify-content:space-between"><span>${yMin}</span><span>${yMax}</span></div>`;
  } else if (state.color === 'difficulty') {
    html = `<div class="bar" style="background:linear-gradient(to right,hsl(130,70%,42%),hsl(65,70%,42%),hsl(0,70%,42%))"></div>
            <div style="display:flex;justify-content:space-between"><span>1 (easy)</span><span>3+ (hard)</span></div>`;
  }
  // the dashed / dotted explanation only matters while unapproved positions exist (not in the public build)
  const unapproved = HIKES.some(h => h.q === 'approx' || h.q === 'area');
  return html + (!unapproved ? '' :
    `<div style="margin-top:4px"><span class="dot approx" style="background:#ccc"></span>tratteggiato = approssimata &nbsp;
     <span class="dot area" style="background:#ccc"></span>puntinato = solo zona</div>`);
}

// ---- map ----------------------------------------------------------------
const map = L.map('map').setView([45.7, 10.2], 9);
// OpenStreetMap's tile servers reject requests without a Referer, and a page opened
// from disk (file://) sends none. So: on file:// default to CARTO tiles; when served
// over http (python build_map.py --serve) default to OpenStreetMap.
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
const baseMaps = {
  'Light (CARTO)': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 20, subdomains: 'abcd',
    attribution: OSM_ATTR + ' &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: OSM_ATTR, referrerPolicy: 'strict-origin-when-cross-origin'
  }),
  'Topographic (OpenTopoMap)': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17, subdomains: 'abc',
    attribution: 'Map data: &copy; OpenStreetMap contributors, <a href="https://viewfinderpanoramas.org">SRTM</a> | ' +
                 'Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
  })
};
baseMaps[location.protocol === 'file:' ? 'Light (CARTO)' : 'OpenStreetMap'].addTo(map);
L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

function iconFor(h) {
  const cls = 'pin' + (h.legs ? ' grp' : '') + (h.q === 'approx' ? ' approx' : h.q === 'area' ? ' area' : '') + (review.cur === h ? ' cur' : '');
  const sz = h.legs ? 22 : 16;
  return L.divIcon({
    className: '',
    html: `<div class="${cls}" style="background:${colorOf(h)}">${h.legs ? h.legs.length : ''}</div>`,
    iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2], popupAnchor: [0, -sz / 2]
  });
}

const onDisk = location.protocol === 'file:';
const TRACK_KIND = { route: 'Percorso disegnato', recorded: 'Traccia registrata', track: 'Traccia GPX' };

const statsOf = h => [
  h.km != null ? fmt(h.km) + ' km' : '',
  h.up != null ? fmt(h.up) + ' m &uarr;' : '',
  h.diffRaw ? 'APE ' + esc(h.diffRaw) : '',
  h.time ? esc(h.time) : '',
  h.loop ? 'loop' : ''
].filter(Boolean).join(' &middot; ');

const posNote = h => h.src === 'manual' ? 'Position set manually'
  : h.q === 'exact' ? 'Position from Maps link'
  : h.q === 'area' ? `&#9888; Area only &ndash; matched &ldquo;${esc((h.match || '').slice(0, 70))}&rdquo; for &ldquo;${esc(h.query)}&rdquo;`
  : `Approximate &ndash; matched &ldquo;${esc((h.match || '').slice(0, 80))}&rdquo; for &ldquo;${esc(h.query)}&rdquo;`;

const linkHtml = h => /^https?:/.test(h.link)
  ? `<div style="margin-top:6px"><a href="${esc(h.link)}" target="_blank" rel="noopener">Apri la scheda &#8599;</a></div>` : '';

// Track buttons of one hike. hideSameEvent: inside a group popup, do not list the sibling legs again.
function tracksHtml(h, hideSameEvent) {
  const tr = h.tracks.map(t => {
    const others = (FILE_HIKES[t.f] || []).filter(o => o !== h && !(hideSameEvent && o.event === h.event));
    return `<div style="margin-top:6px"><div><b>${esc(t.l || TRACK_KIND[t.k] || TRACK_KIND.track)}</b></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px">
        <a style="text-decoration:none;color:inherit;padding:2px 8px;border:1px solid #bbb;border-radius:4px;background:#fff" href="${esc(t.f)}" download>&#11015; GPX</a>
        ${onDisk ? '' : `<button class="act gpx-show" data-f="${esc(t.f)}" data-k="${esc(t.k)}">Mostra</button>`}
      </div>
      ${others.length ? `<div class="muted">Stesso file anche: ${others.slice(0, 8).map(o => `<a href="#" class="goto" data-i="${o.i}">${esc(o.date || o.name)}</a>`).join(', ')}${others.length > 8 ? '&hellip;' : ''}</div>` : ''}</div>`;
  }).join('');
  return tr + (onDisk && tr ? '<div class="muted">Per vedere le tracce sulla mappa apri la pagina online o con --serve.</div>' : '')
    + (!tr && !PUBLIC_BUILD ? `<div class="muted" style="margin-top:4px">GPX: salva come <b>${esc(h.key)}.gpx</b>${h.date ? ' oppure <b>' + esc(h.date) + '.gpx</b>' : ''} nella cartella gpx/ (suffisso _route = percorso disegnato, _rec = registrata; o usa tracks.csv)</div>` : '');
}

function popupHtml(h) {
  const when = h.date ? (h.dateEnd && h.dateEnd !== h.date ? `${h.date} &rarr; ${h.dateEnd}` : h.date) : '';
  const sib = h.leg ? (EVENT_HIKES[h.event] || []) : [];
  const parts = sib.length > 1
    ? `<div class="muted" style="margin-top:2px">Evento in ${sib.length} parti: ${sib.map(o => o === h
        ? `<b>${esc(o.leg)}</b>` : `<a href="#" class="goto" data-i="${o.i}">${esc(o.leg)}</a>`).join(' &middot; ')}</div>` : '';
  return `<b>${esc(h.name)}</b><div class="muted">${when}</div>${parts}
          <div>${statsOf(h)}</div>
          ${h.tags ? `<div class="muted">${esc(h.tags)}</div>` : ''}
          <div class="muted" style="margin-top:4px">${posNote(h)}</div>${linkHtml(h)}${tracksHtml(h, false)}`;
}

// One popup for a whole event: the header, then one TAB per leg (only the selected leg is shown).
// Legs are never added together: the variants of a day are alternatives, so there is no meaningful total.
function groupPopupHtml(g) {
  const when = g.date ? (g.dateEnd && g.dateEnd !== g.date ? `${g.date} &rarr; ${g.dateEnd}` : g.date) : '';
  const firstMatching = Math.max(0, g.legs.findIndex(l => passes(l)));
  const act = (g._tab != null && g._tab < g.legs.length) ? g._tab : firstMatching;     // remembers the last tab used
  const tabs = g.legs.map((l, n) =>
    `<button class="gtab${n === act ? ' on' : ''}${passes(l) ? '' : ' dim'}" data-g="${esc(g.key)}" data-n="${n}">${esc(l.leg)}</button>`).join('');
  const panels = g.legs.map((l, n) => {
    const own = g.lat != null && l.lat != null && (Math.abs(l.lat - g.lat) > 0.001 || Math.abs(l.lon - g.lon) > 0.001);
    return `<div class="gpanel" style="${n === act ? '' : 'display:none'}">
      <span class="muted">${esc(l.date)}</span>
      <div>${statsOf(l) || '<span class="muted">dati da inserire</span>'}</div>
      ${tracksHtml(l, true)}
      ${own ? `<div class="muted">parte da un altro punto &middot; <a href="#" class="ungroup" data-i="${l.i}">mostra come pin separato</a></div>` : ''}</div>`;
  }).join('');
  return `<div class="gwrap"><b>${esc(g.name)}</b> <span class="badge">${g.legs.length} parti</span><div class="muted">${when}</div>
          ${g.tags ? `<div class="muted">${esc(g.tags)}</div>` : ''}
          <div class="gtabs">${tabs}</div>${panels}
          <div class="muted" style="margin-top:6px">${posNote(g)}</div>${linkHtml(g)}</div>`;
}

// Positions placed in review mode are kept in this browser's localStorage. They are keyed by a
// fingerprint of the baked-in data, so after you rebuild with an updated fixes.csv they are dropped.
const fp = (() => {
  let x = 5381;
  const t = JSON.stringify(HIKES.map(h => [h.key, h.lat, h.lon, h.src]));
  for (let k = 0; k < t.length; k++) x = ((x << 5) + x + t.charCodeAt(k)) | 0;
  return (x >>> 0).toString(36);
})();
const LS_KEY = 'hike-fixes:' + fp;
let decisions = {};
try { decisions = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { decisions = {}; }
const saveDecisions = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(decisions)); } catch (e) {} };

function makeMarker(h) {
  h._m = L.marker([h.lat, h.lon], { icon: iconFor(h) });
  h._m.bindPopup(popupHtml(h), { maxWidth: 300 });
}
HIKES.forEach((h, i) => {
  h.i = i;
  const d = decisions[h.key];
  if (d) { h.lat = d[0]; h.lon = d[1]; h.src = 'manual'; h.q = 'exact'; }
  if (h.lat != null && h.lon != null) makeMarker(h);
});

// ---- groups: an event split into legs is ONE pin / ONE list entry while the checkbox is on -------
const GROUPS = [];
Object.keys(EVENT_HIKES).forEach(ev => {
  const legs = EVENT_HIKES[ev].filter(h => h.leg);
  if (legs.length < 2) return;
  const g = { isGroup: true, key: 'g:' + ev, event: ev, legs, name: legs[0].eventName || legs[0].name,
              link: legs[0].link, tags: legs[0].tags, loop: false, _m: null };
  legs.forEach(l => { l._grp = g; });
  GROUPS.push(g);
});
const BYKEY = {};
HIKES.forEach(h => { BYKEY[h.key] = h; });
GROUPS.forEach(g => { BYKEY[g.key] = g; });

// (re)derive the group's data from its legs; the pin sits on the first leg that has a position
function syncGroup(g) {
  const dates = g.legs.map(l => l.date).filter(Boolean).sort();
  g.date = dates[0] || ''; g.dateEnd = dates[dates.length - 1] || '';
  g.year = g.legs[0].year;
  const dn = g.legs.map(l => l.diff).filter(d => d != null);
  g.diff = dn.length ? Math.max(...dn) : null;
  g.tracks = [].concat(...g.legs.map(l => l.tracks));
  // Where does the pin go? 1) the position the legs inherited from the main event (a leg that inherited it
  // still holds it, and follows it if you move it in review mode); 2) if every leg has its own start point,
  // the main event's own position; 3) only if the event has none, the first leg that has a position.
  const inh = g.legs.find(l => !l.ownPos && l.lat != null);
  const first = g.legs.find(l => l.lat != null);
  const l0 = g.legs[0];
  const pos = inh ? { lat: inh.lat, lon: inh.lon, q: inh.q, src: inh.src, match: inh.match, query: inh.query }
    : l0.evLat != null ? { lat: l0.evLat, lon: l0.evLon, q: l0.evQ, src: l0.evSrc, match: l0.evMatch, query: l0.evQuery }
    : first ? { lat: first.lat, lon: first.lon, q: first.q, src: first.src, match: first.match, query: first.query } : null;
  g.lat = pos ? pos.lat : null; g.lon = pos ? pos.lon : null;
  g.q = pos ? pos.q : null; g.src = pos ? pos.src : '';
  g.match = pos ? pos.match : ''; g.query = pos ? pos.query : '';
  if (pos) {
    if (!g._m) { g._m = L.marker([g.lat, g.lon], { icon: iconFor(g) }); g._m.bindPopup('', { maxWidth: 340 }); }
    g._m.setLatLng([g.lat, g.lon]);
    g._m.setPopupContent(groupPopupHtml(g));
  } else g._m = null;
}
GROUPS.forEach(syncGroup);

let layer = null;
const clustering = () => state.cluster && !review.on;
const LABEL = { none: 'no position', area: 'area only', approx: 'approximate', exact: 'exact' };
const problemOf = h => h.q == null ? 'none' : h.q;
const sev = h => h.q == null ? 0 : h.q === 'area' ? 1 : h.q === 'approx' ? 2 : 3;
const flagged = () => HIKES.filter(h => review.all || h.q !== 'exact')
  .sort((a, b) => sev(a) - sev(b) || (a.date || '').localeCompare(b.date || ''));

function focusHike(h) {
  if (!h._m) return;
  if (clustering() && layer.zoomToShowLayer) layer.zoomToShowLayer(h._m, () => h._m.openPopup());
  else { map.setView(h._m.getLatLng(), Math.max(map.getZoom(), 13)); if (!review.on) h._m.openPopup(); }
}

function render() {
  const grouping = state.group && !review.on && GROUPS.length > 0;
  if (grouping) GROUPS.forEach(syncGroup);
  const vis = review.on ? flagged()
    : grouping ? HIKES.filter(h => !h._grp && passes(h)).concat(GROUPS.filter(g => g.legs.some(passes)))
    : HIKES.filter(passes);
  const total = grouping ? HIKES.filter(h => !h._grp).length + GROUPS.length : HIKES.length;
  if (layer) map.removeLayer(layer);
  layer = clustering()
    ? L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45 })
    : L.layerGroup();
  const ms = [];
  vis.forEach(h => { if (h._m) { h._m.setIcon(iconFor(h)); ms.push(h._m); } });
  if (clustering()) layer.addLayers(ms); else ms.forEach(m => layer.addLayer(m));
  map.addLayer(layer);

  const nopos = vis.filter(h => !h._m).length;
  $('status').textContent = review.on
    ? `${vis.length} to review` + (nopos ? ` · ${nopos} without position` : '')
    : `${ms.length} on map` + (nopos ? ` · ${nopos} without position` : '') + ` · ${total} total`;
  $('legend').innerHTML = legendHtml();
  const sorted = review.on ? vis : vis.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  $('list').innerHTML = sorted.map(h =>
    `<li data-k="${esc(h.key)}" class="${h._m ? '' : 'nopos'}${review.cur === h ? ' cur' : ''}"><span class="d">${esc(h.date)}</span>${esc(h.name)}` +
    (h.legs ? ` <span class="badge">${h.legs.length} parti</span>` : '') +
    (review.on ? `<span class="badge ${problemOf(h)}">${LABEL[problemOf(h)]}</span>` : (h._m ? '' : ' <i>(no position)</i>')) + (h.tracks.length ? '<span class="badge gpx">GPX</span>' : '') + `</li>`).join('');
  updateRevbar();
}

function fitResults() {
  const pts = HIKES.filter(h => h._m && passes(h)).map(h => [h.lat, h.lon]);
  if (pts.length) map.fitBounds(pts, { padding: [30, 30] });
}

// ---- controls -----------------------------------------------------------
function buildChips(el, keys, set) {
  el.innerHTML = '';
  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = k; b.dataset.k = k;
    b.onclick = () => { set.has(k) ? set.delete(k) : set.add(k); b.classList.toggle('on', set.has(k)); render(); };
    el.appendChild(b);
  });
}
buildChips($('chips-years'), yearKeys, state.years);
buildChips($('chips-diffs'), diffKeys, state.diffs);

document.querySelectorAll('[data-reset]').forEach(a => a.onclick = () => {
  const which = a.dataset.reset;
  (which === 'years' ? state.years : state.diffs).clear();
  document.querySelectorAll(`#chips-${which} .chip`).forEach(b => b.classList.remove('on'));
  render();
});

const num = v => v === '' ? null : Number(v);
$('q').oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
['km-min', 'km-max', 'up-min', 'up-max'].forEach(id => $(id).oninput = () => {
  state.km = [num($('km-min').value), num($('km-max').value)];
  state.up = [num($('up-min').value), num($('up-max').value)];
  render();
});
$('color').onchange = e => { state.color = e.target.value; render(); };
$('cluster').onchange = e => { state.cluster = e.target.checked; render(); };
$('gpx-only').onchange = e => { state.gpxOnly = e.target.checked; render(); };
$('group').onchange = e => { state.group = e.target.checked; render(); };
$('fit').onclick = fitResults;
$('list').onclick = e => {
  const li = e.target.closest('li'); if (!li) return;
  const h = BYKEY[li.dataset.k];
  if (!h) return;
  if (review.on) { selectHike(h); return; }
  if (h._m) focusHike(h); else if (/^https?:/.test(h.link)) window.open(h.link, '_blank', 'noopener');
};

// ---- GPX tracks: loaded only when a "Mostra" button is pressed ----------------------------
const trackLayer = L.featureGroup().addTo(map);
const trackPts = {};      // file -> [[lat, lon], ...]   (one download per file, however many hikes share it)
const trackLines = {};    // file|kind -> polyline
const trackStyle = k => k === 'route'
  ? { color: '#1f4fd8', weight: 4, opacity: 0.9, dashArray: '8 6' }      // drawn route: dashed blue
  : { color: '#d62728', weight: 4, opacity: 0.85 };                      // recorded / neutral: solid red
const isShown = (f, k) => !!trackLines[f + '|' + k] && trackLayer.hasLayer(trackLines[f + '|' + k]);

async function trackPoints(f) {
  if (trackPts[f]) return trackPts[f];
  const r = await fetch(f);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const xml = new DOMParser().parseFromString(await r.text(), 'application/xml');
  let pts = [...xml.getElementsByTagName('trkpt')];
  if (!pts.length) pts = [...xml.getElementsByTagName('rtept')];
  const ll = pts.map(p => [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))])
                .filter(a => isFinite(a[0]) && isFinite(a[1]));
  if (!ll.length) throw new Error('no points');
  return (trackPts[f] = ll);
}

async function toggleTrack(f, k, btn) {
  const key = f + '|' + k;
  try {
    if (isShown(f, k)) { trackLayer.removeLayer(trackLines[key]); btn.textContent = 'Mostra'; }
    else {
      const ll = await trackPoints(f);
      const line = trackLines[key] = trackLines[key] || L.polyline(ll, trackStyle(k));
      trackLayer.addLayer(line);
      if (k !== 'route') line.bringToFront();         // recorded track on top of the drawn route
      map.fitBounds(line.getBounds(), { padding: [30, 30] });
      btn.textContent = 'Nascondi';
    }
    $('clear-tracks').style.display = trackLayer.getLayers().length ? '' : 'none';
  } catch (e) {
    btn.textContent = 'Non disponibile'; btn.disabled = true;
  }
}
document.addEventListener('click', e => {
  const t = e.target;
  if (!t || !t.closest) return;
  const b = t.closest('.gpx-show');
  if (b) { toggleTrack(b.dataset.f, b.dataset.k, b); return; }
  const g = t.closest('.goto');                       // "same file also: 2019-03-31" -> jump to that hike
  if (g) {
    e.preventDefault();
    const o0 = HIKES[+g.dataset.i];
    const o = (o0._grp && state.group && !review.on) ? o0._grp : o0;       // while grouped, jump to the group's pin
    if (o._m && layer && layer.hasLayer(o._m)) focusHike(o);
    else if (o._m) map.setView(o._m.getLatLng(), Math.max(map.getZoom(), 13));
  }
  const tb = t.closest('.gtab');                      // tab inside the popup of a grouped event
  if (tb) {
    const grp = BYKEY[tb.dataset.g];
    grp._tab = +tb.dataset.n;                         // survives re-rendering (filters) and reopening
    if (grp._m) {
      grp._m.setPopupContent(groupPopupHtml(grp));    // rebuilds the content and resizes the open popup
      syncTrackButtons(grp._m.getPopup().getElement());
    }
    return;
  }
  const u = t.closest('.ungroup');                    // "parte da un altro punto: mostra come pin separato"
  if (u) {
    e.preventDefault();
    const o = HIKES[+u.dataset.i];
    state.group = false; $('group').checked = false; render();
    if (o._m) { if (layer.hasLayer(o._m)) focusHike(o); else map.setView(o._m.getLatLng(), 15); }
  }
});
function syncTrackButtons(el) {                       // keep the button labels in sync with the map
  if (el) el.querySelectorAll('.gpx-show').forEach(b => { b.textContent = isShown(b.dataset.f, b.dataset.k) ? 'Nascondi' : 'Mostra'; });
}
map.on('popupopen', e => syncTrackButtons(e.popup.getElement()));
$('clear-tracks').onclick = () => { trackLayer.clearLayers(); $('clear-tracks').style.display = 'none'; };

// ---- review mode: click the map to place / confirm a hike -------------------
function setPos(h, lat, lon, grp) {
  review.history.push({ h, grp, prev: { lat: h.lat, lon: h.lon, src: h.src, q: h.q, dec: decisions[h.key] } });
  h.lat = lat; h.lon = lon; h.src = 'manual'; h.q = 'exact';
  if (h._m) { h._m.setLatLng([lat, lon]); h._m.setPopupContent(popupHtml(h)); } else makeMarker(h);
  decisions[h.key] = [lat, lon];
  saveDecisions();
}

function restore(x) {
  const { h, prev } = x;
  h.lat = prev.lat; h.lon = prev.lon; h.src = prev.src; h.q = prev.q;
  if (prev.dec) decisions[h.key] = prev.dec; else delete decisions[h.key];
  if (h.lat == null) delete h._m;
  else if (h._m) { h._m.setLatLng([h.lat, h.lon]); h._m.setPopupContent(popupHtml(h)); }
  return h;
}

function undo() {
  const x = review.history.pop();
  if (!x) return;
  let h = restore(x);
  while (x.grp && review.history.length && review.history[review.history.length - 1].grp === x.grp)
    h = restore(review.history.pop());                 // legs placed together are undone together
  saveDecisions();
  review.cur = h; review.msg = 'Undone: ' + h.name;
  render(); updateCard();
  if (h._m) map.setView(h._m.getLatLng(), Math.max(map.getZoom(), 13));
}

function selectHike(h) {
  const old = review.cur;
  review.cur = h || null;
  [old, h].forEach(x => { if (x && x._m) x._m.setIcon(iconFor(x)); });
  updateCard();
  document.querySelectorAll('#list li').forEach(li => {
    const on = review.cur && li.dataset.k === review.cur.key;
    li.classList.toggle('cur', !!on);
    if (on && li.scrollIntoView) li.scrollIntoView({ block: 'nearest' });
  });
  if (h && h._m) map.setView(h._m.getLatLng(), Math.max(map.getZoom(), 13));
}

function decide(h, lat, lon, msg) {
  const before = flagged(), idx = before.indexOf(h);
  const grp = Date.now() + ':' + Math.random();
  // the other legs of the same event that still share this hike's (unapproved) position follow it
  const sib = (EVENT_HIKES[h.event] || []).filter(o => o !== h && o.q !== 'exact' &&
    (h.lat == null ? o.lat == null : (o.lat === h.lat && o.lon === h.lon)));
  setPos(h, lat, lon, grp);
  sib.forEach(o => setPos(o, lat, lon, grp));
  review.msg = msg + (sib.length ? ` (+${sib.length} parti dello stesso evento)` : '');
  render();
  const after = flagged();
  selectHike(before.slice(idx + 1).find(o => after.includes(o)) || after[0] || null);
}

function updateCard() {
  const c = $('rcard'), h = review.cur;
  c.style.display = review.on ? 'block' : 'none';
  if (!review.on) return;
  let html;
  if (!h) {
    html = `<b>${flagged().length ? 'Pick a hike in the list below.' : 'Nothing left to review.'}</b>`;
  } else {
    const stats = [h.km != null ? fmt(h.km) + ' km' : '', h.up != null ? fmt(h.up) + ' m \u2191' : ''].filter(Boolean).join(' \u00b7 ');
    html = `<div><b>${esc(h.name)}</b><span class="badge ${problemOf(h)}">${LABEL[problemOf(h)]}</span></div>
      <div class="muted">${esc(h.date)}${stats ? ' \u00b7 ' + stats : ''}</div>
      ${h.match ? `<div class="muted">now: ${esc(h.match.slice(0, 80))}</div>` : ''}
      <div style="margin-top:4px"><b>Click the map</b> where this hike starts.</div>
      <div class="btns">
        ${/^https?:/.test(h.link) ? `<a class="act" href="${esc(h.link)}" target="_blank" rel="noopener">Hike page &#8599;</a>` : ''}
        <a class="act" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(h.name)}" target="_blank" rel="noopener">Search in Google Maps &#8599;</a>
        <button class="act" data-act="ok" ${h.lat == null ? 'disabled' : ''}>&#10003; Position is right</button>
        <button class="act" data-act="skip">Skip &rarr;</button>
      </div>`;
  }
  html += `<div class="btns"><button class="act" data-act="undo" ${review.history.length ? '' : 'disabled'}>&#8630; Undo</button></div>`;
  if (review.msg) html += `<div class="muted" style="margin-top:4px">${esc(review.msg)}</div>`;
  c.innerHTML = html;
}

function updateRevbar() {
  const nm = HIKES.filter(h => h.src === 'manual').length;
  $('rev-info').textContent = `${flagged().length} to review \u00b7 ${nm} placed by hand`;
  $('rev-dl').disabled = nm === 0;
}

function exportFixes() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = HIKES.filter(h => h.src === 'manual' && h.lat != null)
    .map(h => [h.key, h.lat + ', ' + h.lon, h.name, h.date, 'manual'].map(q).join(','));
  const csv = '\ufeff' + 'key,latlon,name,date,note\r\n' + rows.join('\r\n') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'fixes.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

map.on('click', e => {
  if (!review.on || !review.cur) return;
  const h = review.cur;
  decide(h, +e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6), 'Placed: ' + h.name);
});
$('rcard').onclick = e => {
  const b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  const h = review.cur, act = b.dataset.act;
  if (act === 'undo') undo();
  else if (h && act === 'ok' && h.lat != null) decide(h, h.lat, h.lon, 'Confirmed: ' + h.name);
  else if (h && act === 'skip') {
    const l = flagged(), nx = l[l.indexOf(h) + 1];
    if (nx) { review.msg = ''; selectHike(nx); } else { review.msg = 'End of the list.'; updateCard(); }
  }
};
$('rev-toggle').onclick = () => {
  review.on = !review.on;
  review.cur = null; review.msg = '';
  $('panel').classList.toggle('review', review.on);
  $('map').classList.toggle('reviewing', review.on);
  $('rev-toggle').textContent = review.on ? 'Exit review mode' : 'Review mode';
  $('rev-all-wrap').style.display = review.on ? '' : 'none';
  render();
  if (review.on) selectHike(flagged()[0] || null); else updateCard();
};
$('rev-all').onchange = e => { review.all = e.target.checked; review.cur = null; render(); selectHike(flagged()[0] || null); };
$('rev-dl').onclick = exportFixes;
$('rev-reset').onclick = () => {
  if (confirm('Discard all positions you placed in this browser and reload?')) {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    location.reload();
  }
};

$('subtitle').textContent = `${HIKES.length} escursioni` + (numYears.length ? `, ${yMin}\u2013${yMax}` : '');
render();
fitResults();
</script>
</body>
</html>
